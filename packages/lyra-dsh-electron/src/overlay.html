<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: rgba(0, 0, 0, 0.55);
      color: #e5e7eb;
      -webkit-user-select: none;
      user-select: none;
    }
    .box { text-align: center; max-width: 480px; padding: 24px; }
    #title { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    #detail { font-size: 14px; color: #9ca3af; margin: 0 0 20px; white-space: pre-wrap; word-break: break-word; }
    #restart {
      display: none;
      padding: 8px 22px;
      font-size: 14px;
      border: 1px solid #4b5563;
      border-radius: 6px;
      background: #1f2937;
      color: #e5e7eb;
      cursor: pointer;
    }
    #restart:hover { background: #374151; }
  </style>
</head>
<body>
  <div class="box">
    <div id="title"></div>
    <div id="detail"></div>
    <button id="restart" type="button">重启</button>
  </div>
</body>
</html>
