<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0d1017;
        color: #e6e8eb;
      }
      .card {
        text-align: center;
        padding: 2rem;
      }
      .spinner {
        width: 32px;
        height: 32px;
        margin: 0 auto 1rem;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #5b7cfa;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
        opacity: 0.85;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
        background: rgba(255, 255, 255, 0.08);
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <p>Starting dsh&hellip;</p>
      <p>
        Profile <code>web</code> &middot; no browser is opened; the UI loads inside
        this window.
      </p>
    </div>
  </body>
</html>
